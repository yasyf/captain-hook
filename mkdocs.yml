site_name: captain-hook
site_description: Declarative hook framework for Claude Code
site_url: https://captain-hook.readthedocs.io

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
    - How It Works: getting-started/how-it-works.md
  - Guide:
    - guide/index.md
    - Hooks & Events: guide/hooks-and-events.md
    - Conditions: guide/conditions.md
    - Primitives: guide/primitives.md
    - Transcript & Signals: guide/transcript-signals.md
    - LLM Hooks: guide/llm-hooks.md
    - Workflows: guide/workflows.md
    - State & Sessions: guide/state.md
    - Testing: guide/testing.md
    - Configuration: guide/configuration.md
    - Patterns: guide/patterns.md
    - Troubleshooting: guide/troubleshooting.md
  - Examples:
    - examples/index.md
    - Audit Logging: examples/audit.md
    - Code Quality: examples/code-quality.md
    - Command Safety: examples/command-safety.md
    - Custom Condition: examples/custom-condition.md
    - Failure Recovery: examples/failure-recovery.md
    - Multi-Step Workflow: examples/multi-step-workflow.md
    - Session Workflow: examples/session-workflow.md
    - Settings Config: examples/settings-config.md
    - Test Integrity: examples/test-integrity.md
  - Reference:
    - reference/index.md
    - CLI: reference/cli.md
    - Conditions Cheatsheet: reference/conditions.md
    - API: reference/api/
    - Changelog: reference/changelog.md

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_style: google
            docstring_options:
              warn_missing_types: false
              warn_unknown_params: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - def_list
  - md_in_html
