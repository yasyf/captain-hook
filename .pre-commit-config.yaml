# GENERATED by cc-guides from .claude/fragments/.pre-commit-config.yaml/ — do not edit; edit the fragments and run 'cc-guides render'.
# Commit-time checks, composed by cc-guides from the shared cc-skills pack.
# Run by prek — a fast Rust drop-in for pre-commit: `ccx vcs ship` runs these
# hooks before every commit, and `uvx prek install` wires them into plain
# `git commit` too.
# prek-only: the `repo: builtin` hooks are prek-native (Rust, offline, no rev);
# legacy pre-commit cannot parse this file.
# Rev pins are centrally managed in the cc-skills pack fragments — a local
# `uvx prek autoupdate` shows up as drift and the daily re-render reverts it.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 1 MiB, not the 500 KB default: gen-image compresses repo brand images
        # (banners, social cards) to just under 1 MiB.
        args: [--maxkb=1024]
      - id: detect-private-key

# Python: mechanical linting (ruff format + import/lint --fix) and a
# whole-project ty type check on every commit. Continues the `repos:` list
# precommit-base opens.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    # The rev pins the ty version (the hook entry carries --ty-version).
    # Warning-only: [tool.ty.rules] sets all = "warn", so ty exits 0 and never
    # blocks a commit.
    rev: v0.0.48
    hooks:
      - id: ty
        # A passing hook hides its output by default; verbose surfaces the warnings.
        verbose: true
