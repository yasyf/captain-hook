# GENERATED by cc-guides from .claude/fragments/pre-commit-config.yaml/ — do not edit; edit the fragments and push — CI renders.
# Commit-time checks, composed by cc-guides from the shared cc-skills pack.
# Run by prek — a fast Rust drop-in for pre-commit: `ccx vcs ship` runs these
# hooks before every commit, and `uvx prek install` wires them into plain
# `git commit` too.
# prek-only: the `repo: builtin` hooks are prek-native (Rust, offline, no rev);
# legacy pre-commit cannot parse this file.
# Rev pins are centrally managed in the cc-skills pack fragments — a local
# `uvx prek autoupdate` shows up as drift and the daily re-render reverts it.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # Skill template trees hold moustache sources (section markers and
        # mid-scalar placeholder tokens) that are not YAML/JSON/TOML documents;
        # they are validated post-render. Inert in repos without such paths.
        exclude: ^plugins/[^/]+/skills/[^/]+/templates/
      - id: check-json
        exclude: ^plugins/[^/]+/skills/[^/]+/templates/
      - id: check-toml
        exclude: ^plugins/[^/]+/skills/[^/]+/templates/
      - id: check-merge-conflict
      - id: check-added-large-files
        # 1 MiB, not the 500 KB default: gen-image compresses repo brand images
        # (banners, social cards) to just under 1 MiB.
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.48
    hooks:
      - id: ty
        entry: sh -c 'uv sync --locked --inexact --no-install-project --no-build && uv check --quiet --preview-features=check-command --ty-version=0.0.48 --no-sync --no-build'
        verbose: true

# Generated bundles must remain byte-identical to the locked esbuild output.
exclude: ^docs/tutorial/widgets/(compiler|editor|emulator|llm)\.js$
