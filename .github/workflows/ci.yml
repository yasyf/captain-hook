name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify every top-level directory is documented
        run: |
          set -euo pipefail
          fragment=.claude/fragments/AGENTS.md/captain-hook-development-guide.fragment.md
          missing=()
          while IFS= read -r dir; do
            grep -Fq "$dir/" "$fragment" || missing+=("$dir")
          done < <(git ls-files | awk -F/ 'NF>1 {print $1}' | sort -u)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::undocumented top-level directory: %s\n' "${missing[@]}"
            exit 1
          fi

  go-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5

      - name: Test capt-hookd
        run: go test -race -count=1 ./...

  go-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5

      - name: Test capt-hookd
        run: go test -race -count=1 ./...

      - name: Verify fatal release preflight against its unchanged baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline=3e1468c6296937b11cdcc4e3c73cc034794e9212
          baseline_dir="$RUNNER_TEMP/fatal-preflight-baseline"
          baseline_log="$RUNNER_TEMP/fatal-preflight-baseline.log"
          filter='^TestAwaitResolvableReturnsNonResolutionExitWithItsDiagnostic$'
          git fetch --no-tags --depth=1 origin "$baseline"
          git worktree add --detach "$baseline_dir" "$baseline"
          cp internal/hookd/toolrelease_test.go "$baseline_dir/internal/hookd/toolrelease_test.go"
          set +e
          (cd "$baseline_dir" && go test -race -count=1 ./internal/hookd -run "$filter") > "$baseline_log" 2>&1
          baseline_status=$?
          set -e
          cat "$baseline_log"
          test "$baseline_status" -ne 0
          grep -Fq 'want wrapped uv exit 2' "$baseline_log"
          grep -Fq 'want wrapped uv exit 7' "$baseline_log"
          grep -Fq -- '--- FAIL: TestAwaitResolvableReturnsNonResolutionExitWithItsDiagnostic/exit2' "$baseline_log"
          grep -Fq -- '--- FAIL: TestAwaitResolvableReturnsNonResolutionExitWithItsDiagnostic/exit7' "$baseline_log"
          go test -race -count=1 ./internal/hookd -run "$filter"

  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          cache-dependency-glob: uv.lock

      - name: Resolve spaCy minor
        id: spacy
        run: echo "minor=$(grep -A1 '^name = \"spacy\"$' uv.lock | grep '^version' | grep -o '[0-9]*\.[0-9]*' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NLP assets
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/spacy/models
            ~/.wn_data
          key: nlp-v6-${{ runner.os }}-spacy-${{ steps.spacy.outputs.minor }}-oewn-31f4af16c54b532fd5484d4cc33aee588a31bb5b70683ae8197842fde5b586bc

      - name: Sync development environment
        run: uv sync --locked --extra dev

      - name: Provision NLP assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -c "from captain_hook.util.model_cache import ensure_nlp_resources; ensure_nlp_resources()"

      - name: Build two releases of the wheel and host
        run: |
          set -euo pipefail
          uv build --wheel --out-dir "$RUNNER_TEMP/wheelhouse"
          go build -o "$RUNNER_TEMP/capt-hookd" ./cmd/capt-hookd
          uv version --frozen 0.0.1
          uv build --wheel --out-dir "$RUNNER_TEMP/wheelhouse-next"
          git checkout pyproject.toml
          go build -ldflags "-X github.com/yasyf/captain-hook/internal/hookd.Build=0.0.1" \
            -o "$RUNNER_TEMP/capt-hookd-next" ./cmd/capt-hookd

      - name: Install the host
        env:
          UV_FIND_LINKS: ${{ runner.temp }}/wheelhouse
        run: |
          set -euo pipefail
          bash -n captain_hook/linux/install.sh
          "$RUNNER_TEMP/capt-hookd" package-install
          test "$(cat ~/.local/share/captain-hook/host/version.json)" = '{"schema":1,"build":"0.0.0"}'
          cmp "$RUNNER_TEMP/capt-hookd" ~/.local/share/captain-hook/host/capt-hookd
          test "$(~/.local/bin/capt-hookd --version)" = '{"schema":1,"build":"0.0.0"}'
          test "$(realpath ~/.local/bin/capt-hook)" = "$(realpath ~/.daemonkit/tools/capt-hook/0.0.0/capt-hook/bin/capt-hook)"
          ~/.local/bin/capt-hook --help > /dev/null

      - name: Start the workspace supervisor
        run: |
          set -euo pipefail
          setsid nohup ~/.local/bin/capt-hookd supervise > "$RUNNER_TEMP/supervisor.out" 2>&1 < /dev/null &
          for _ in $(seq 60); do
            captain_hook/bin/hook status > /dev/null 2>&1 && exit 0
            sleep 1
          done
          captain_hook/bin/hook status

      - name: Dispatch through the plugin shims
        env:
          CAPTAIN_TEST_LINUX_HOST_MISMATCH: ${{ runner.temp }}/capt-hookd-next
        run: |
          set -euo pipefail
          captain_hook/bin/capt-hook --help > /dev/null
          uv run --no-sync pytest tests/test_linux_host.py tests/test_formula_deployment_contract.py

      - name: Upgrade the supervised host in place
        env:
          UV_FIND_LINKS: ${{ runner.temp }}/wheelhouse-next
        run: |
          set -euo pipefail
          before="$(captain_hook/bin/hook status | jq -r .pid)"
          "$RUNNER_TEMP/capt-hookd-next" package-install
          test "$(cat ~/.local/share/captain-hook/host/version.json)" = '{"schema":1,"build":"0.0.1"}'
          status="$(captain_hook/bin/hook status)"
          test "$(jq -r .build <<< "$status")" = 0.0.1
          test "$(jq -r .pid <<< "$status")" != "$before"
          test "$(realpath ~/.local/bin/capt-hook)" = "$(realpath ~/.daemonkit/tools/capt-hook/0.0.1/capt-hook/bin/capt-hook)"
          ~/.local/bin/capt-hook --help > /dev/null

      - name: Dispatch through the upgraded host
        env:
          CAPTAIN_TEST_LINUX_HOST_MISMATCH: ${{ runner.temp }}/capt-hookd
        run: |
          set -euo pipefail
          captain_hook/bin/capt-hook --help > /dev/null
          uv run --no-sync pytest tests/test_linux_host.py

      - name: Uninstall the host
        run: |
          set -euo pipefail
          ~/.local/bin/capt-hookd package-uninstall
          test ! -L ~/.local/bin/capt-hookd
          test ! -L ~/.local/bin/capt-hook
          test ! -e ~/.local/share/captain-hook/host

      - name: Host logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/supervisor.out" || true
          cat ~/.cache/captain-hook/host-v1/capt-hookd.log || true

  helper-test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5

      - name: Test Captain Hook helper
        run: |
          brew install xcodegen
          helper/scripts/build-capt-hookd.sh 0.0.0 helper/Generated/capt-hookd tests/fixtures/capt-hookd
          cd helper
          ./gen-version-xcconfig.sh 0.0.0
          xcodegen generate
          GITHUB_REF_NAME=v0.0.0 xcodebuild test -project CaptainHook.xcodeproj -scheme CaptainHook \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  test:
    runs-on: ${{ matrix.os == 'macos-15' && 'macos-15-intel' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest, macos-15]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        exclude:
          - {os: macos-15, shard: 2}
          - {os: macos-15, shard: 3}
          - {os: macos-15, shard: 4}
          - {os: macos-15, shard: 5}
          - {os: macos-15, shard: 6}
          - {os: macos-15, shard: 7}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        if: matrix.shard == 0
        with:
          go-version: 1.26.5

      - uses: ./.github/actions/python-tests
        with:
          python-version: ${{ matrix.python-version }}
          shard-count: ${{ matrix.os == 'macos-15' && '2' || '8' }}
          shard-index: ${{ matrix.shard }}
          workers: ${{ matrix.os == 'macos-15' && '1' || '0' }}

      - name: Record async foreground evidence timing
        if: always() && matrix.os == 'macos-15' && matrix.shard == 1
        run: |
          uv run --no-sync pytest -n 0 -s \
            tests/test_foreground_evidence_budgets.py::test_async_hooks_read_the_transcript_after_the_foreground_deadline

      - name: Verify graph deadlines do not replay as evidence
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 0
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/graph-deadline-progress-before"
          git fetch --no-tags --depth=1 origin 130a8f0a8457e20fd06f73a28bbc7c3aee9752e1
          git worktree add --detach "$baseline" 130a8f0a8457e20fd06f73a28bbc7c3aee9752e1
          test "$(git -C "$baseline" rev-parse HEAD)" = 130a8f0a8457e20fd06f73a28bbc7c3aee9752e1
          cp tests/testdata/snapshot-graph-deadline-before.py.txt "$baseline/tests/test_snapshot_graph_deadline_progress.py"
          (cd "$baseline" && uv sync --locked --extra dev)
          if (cd "$baseline" && PYTHONPATH="$baseline:$baseline/tests" "$baseline/.venv/bin/python" -m pytest tests/test_snapshot_graph_deadline_progress.py::test_prepare_graph_deadline_is_not_evidence_for_a_later_request -n 0 -s) > "$RUNNER_TEMP/graph-deadline-progress-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/graph-deadline-progress-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/graph-deadline-progress-negative.log"
          grep -F 'GRAPH_DEADLINE_REPLAY_PREVENTED_PROGRESS' "$RUNNER_TEMP/graph-deadline-progress-negative.log"
          grep -F 'FAILED tests/test_snapshot_graph_deadline_progress.py::test_prepare_graph_deadline_is_not_evidence_for_a_later_request' "$RUNNER_TEMP/graph-deadline-progress-negative.log"
          grep -F '1 failed' "$RUNNER_TEMP/graph-deadline-progress-negative.log"
          uv run --no-sync pytest tests/test_snapshot_graph_deadline_progress.py -n 0 -s > "$RUNNER_TEMP/graph-deadline-progress-positive.log" 2>&1
          cat "$RUNNER_TEMP/graph-deadline-progress-positive.log"
          grep -F '5 passed' "$RUNNER_TEMP/graph-deadline-progress-positive.log"

      - name: Retain graph deadline replay controls
        if: always() && matrix.os == 'ubuntu-latest' && matrix.shard == 0
        uses: actions/upload-artifact@v7
        with:
          name: graph-deadline-progress-controls
          path: ${{ runner.temp }}/graph-deadline-progress-*.log

      - name: Verify the immutable Slack outer timing regression
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 0
        run: |
          baseline="$RUNNER_TEMP/slack-ticket-timing-before"
          git fetch --no-tags --depth=1 origin 2068d95872684b5a6ac729b38b5b09a361709d74
          git worktree add --detach "$baseline" 2068d95872684b5a6ac729b38b5b09a361709d74
          cp tests/test_ticket_latency_metadata.py "$baseline/tests/test_ticket_latency_metadata.py"
          (cd "$baseline" && uv sync --locked --extra dev)
          if (cd "$baseline" && PYTHONPATH="$baseline:$baseline/tests" "$baseline/.venv/bin/python" -m pytest 'tests/test_ticket_latency_metadata.py::test_slack_outer_ticket_timings[mint-slack]' -n 0 -s) > "$RUNNER_TEMP/slack-ticket-timing-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/slack-ticket-timing-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/slack-ticket-timing-negative.log"
          grep -F 'SLACK_OUTER_STAGE_MISSING: check' "$RUNNER_TEMP/slack-ticket-timing-negative.log"
          grep -F '1 failed' "$RUNNER_TEMP/slack-ticket-timing-negative.log"
          uv run --no-sync pytest tests/test_ticket_latency_metadata.py -n 0 -q -s

      - name: Verify the immutable repeated-plugin probe regression
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 0
        env:
          CAPT_PLUGIN_RESOLUTION_BASELINE: ${{ runner.temp }}/plugin-resolution-before.py
        run: |
          git fetch --no-tags --depth=1 origin cbf52d54cb4a02f8f4ac5dd9f98eeebb21f8ed0c
          git show cbf52d54cb4a02f8f4ac5dd9f98eeebb21f8ed0c:captain_hook/packs/plugins.py > "$CAPT_PLUGIN_RESOLUTION_BASELINE"
          if uv run --no-sync pytest tests/test_plugin_resolution_probes.py -n 0 -q -s -k test_repeated_plugin_paths_are_probed_once_per_resolution > "$RUNNER_TEMP/plugin-resolution-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/plugin-resolution-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/plugin-resolution-negative.log"
          grep -F 'duplicate plugin filesystem probes were repeated' "$RUNNER_TEMP/plugin-resolution-negative.log"
          env -u CAPT_PLUGIN_RESOLUTION_BASELINE uv run --no-sync pytest tests/test_plugin_resolution_probes.py -n 0 -q -s

      - name: Verify bounded CLI log reads against the immutable baseline
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 0
        env:
          CAPT_LOG_TAIL_BASELINE: ${{ runner.temp }}/cli-log-tail-before.py
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 5a11cb44b376c25d66b0eb3dbd324923ee8addc7
          git show 5a11cb44b376c25d66b0eb3dbd324923ee8addc7:captain_hook/cli.py > "$CAPT_LOG_TAIL_BASELINE"
          if uv run --no-sync pytest tests/test_cli.py::TestLogsSubcommand::test_positive_tail_reads_only_log_suffix -n 0 -s > "$RUNNER_TEMP/cli-log-tail-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cli-log-tail-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cli-log-tail-negative.log"
          grep -F 'positive log tail read the full prefix' "$RUNNER_TEMP/cli-log-tail-negative.log"
          grep -F '1 failed' "$RUNNER_TEMP/cli-log-tail-negative.log"
          env -u CAPT_LOG_TAIL_BASELINE uv run --no-sync pytest tests/test_cli.py::TestLogsSubcommand -n 0 -q -s

      - name: Build + smoke-test wheel in a fresh venv
        if: matrix.shard == 0
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --refresh-package cc-transcript --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/capt-hook --help
          test -x .wheel-smoke/bin/hook
          test -x .wheel-smoke/bin/hookd
          # This venv resolves dependencies from the index, not uv.lock, so it is the only
          # CI environment shaped like a release install. `capt-hook mcp` must speak protocol
          # here: an `mcp` major the lock never tested is exactly how the server shipped dead.
          .wheel-smoke/bin/python - .wheel-smoke/bin/capt-hook <<'PY'
          import json, subprocess, sys, threading

          proc = subprocess.Popen([sys.argv[1], "mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          # Non-daemon, so leaving it armed after a pass stalls every matrix job for its full delay.
          watchdog = threading.Timer(120, proc.kill)
          watchdog.start()


          def send(message):
              proc.stdin.write(json.dumps(message) + "\n")
              proc.stdin.flush()


          def receive(method):
              line = proc.stdout.readline()
              if not line:
                  raise SystemExit(f"capt-hook mcp closed stdout during {method} (traceback above)")
              return json.loads(line)


          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2025-06-18", "capabilities": {},
              "clientInfo": {"name": "wheel-smoke", "version": "1"}}})
          init = receive("initialize")
          send({"jsonrpc": "2.0", "method": "notifications/initialized", "params": {}})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}})
          listed = receive("tools/list")
          proc.terminate()
          proc.wait(timeout=30)
          watchdog.cancel()

          assert init["result"]["serverInfo"]["name"] == "capt-hook", init
          assert [t["name"] for t in listed["result"]["tools"]] == ["register_transcript"], listed
          print("MCP liveness OK")
          PY
          # The thin client must stay stdlib-pure: importing it may pull in neither
          # captain_hook.* nor any third-party module before it execs the signed host.
          .wheel-smoke/bin/python -c 'import sys; b=set(sys.modules); import capt_hook_client.client; new=set(sys.modules)-b; std=set(sys.stdlib_module_names); cap=sorted(m for m in new if m.startswith("captain_hook")); bad=sorted(m for m in new if m.split(".")[0] not in std and not m.startswith("capt_hook_client")); assert not cap, f"client imported captain_hook: {cap}"; assert not bad, f"client imported non-stdlib: {bad}"; print("client purity OK")'
          unzip -l dist/*.whl | grep -q 'capt_hook_client/client.py'
          if unzip -l dist/*.whl | grep -q 'capt_hook_client/key.py'; then exit 1; fi
          unzip -l dist/*.whl | grep -q 'captain_hook/langs.py'
          unzip -l dist/*.whl | grep -q 'captain_hook/guard_literal.py'
          unzip -l dist/*.whl | grep -q 'capt_hook_client/guard_literal.py'
          tar tzf dist/*.tar.gz | grep -q 'internal/wireproto/guard.json'
          .wheel-smoke/bin/python -c 'from capt_hook_client import guard_literal as shim; from captain_hook import guard_literal as guard; import inspect; assert inspect.getsource(shim) == inspect.getsource(guard); assert shim.mandatory("PreToolUse", b"{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"pkill -x sleep\"}}"); print("guard literal OK")'
          unzip -l dist/*.whl | grep -q 'captain_hook/snapshots/worker.py'
          unzip -l dist/*.whl | grep -q 'captain_hook/snapshots/schemas/host-request.schema.json'
          .wheel-smoke/bin/python -c 'from captain_hook.snapshots.validation import validator; from cc_transcript.snapshots import TranscriptStore; validator("host-request").check_schema(validator("host-request").schema)'
          if unzip -l dist/*.whl | grep -q 'captain_hook/exports.py'; then exit 1; fi
          unzip -l dist/*.whl | grep -q 'captain_hook/skills/.*/SKILL.md'
          unzip -l dist/*.whl | grep -q 'captain_hook/.claude-plugin/plugin.json'
          # Only the NLP builtins carry a pack.toml descriptor; every builtin ships its hooks/ payload.
          unzip -l dist/*.whl | grep -q 'captain_hook/builtin_packs/general/pack.toml'
          unzip -l dist/*.whl | grep -q 'captain_hook/builtin_packs/steering/pack.toml'
          unzip -l dist/*.whl | grep -qE 'captain_hook/builtin_packs/general/hooks/[^/]+\.py'
          unzip -l dist/*.whl | grep -qE 'captain_hook/builtin_packs/fixes/hooks/[^/]+\.py'
          unzip -l dist/*.whl | grep -q 'captain_hook/builtin_packs/general/hooks/prompts/'
          if unzip -l dist/*.whl | grep -q 'stress/'; then exit 1; fi
          if tar tzf dist/*.tar.gz | grep -q '/stress/'; then exit 1; fi
          smoke_proj="$(mktemp -d)"
          (cd "$smoke_proj" && "$GITHUB_WORKSPACE/.wheel-smoke/bin/capt-hook" skills install)
          grep -q '"captain-hook@captain-hook": true' "$smoke_proj/.claude/settings.json"
          test ! -e "$smoke_proj/.claude/skills"

  descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5

      - name: Parse-validate the binrun descriptors
        run: |
          set -euo pipefail
          for descriptor in captain_hook/bin/hook.binrun captain_hook/bin/capt-hook.binrun captain_hook/linux/bin/capt-hook.binrun; do
            go run github.com/yasyf/binrun/cmd/binrun@v0.6.0 -- parse "$descriptor"
          done
