name: Diagnostic SDK latency A-B-B-A

on:
  pull_request:

permissions:
  contents: read

jobs:
  controlled-abba:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
      - uses: ./.github/actions/latency-abba
        with:
          python-version: "3.13"
          shard-count: "8"
          shard-index: "0"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-graph-latency-abba
          path: ${{ runner.temp }}/capt-sdk-latency-abba
          if-no-files-found: error
