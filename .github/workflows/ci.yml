name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      # The spacy model lives in .venv (outside the lockfile) and the wordnet
      # lexicon in ~/.wn_data; cache both keyed on the lock so provisioning
      # only runs when the environment actually changes. The sync must be
      # --inexact or it would prune the cached model from the venv.
      - name: Cache NLP assets
        id: nlp-cache
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.wn_data
          key: nlp-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Sync (dev)
        run: uv sync --inexact --extra dev

      - name: Provision NLP assets
        if: steps.nlp-cache.outputs.cache-hit != 'true'
        run: |
          uv run python -m spacy download en_core_web_sm
          uv run python -c "import wn; wn.download('oewn:2025')"

      - name: Test (pytest)
        run: uv run pytest

      - name: Build + smoke-test wheel in a fresh venv
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/capt-hook --help
