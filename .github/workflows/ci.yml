name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5

      - name: Test Captain Hook helper
        run: |
          brew install xcodegen
          helper/scripts/build-capt-hookd.sh 0.0.0 helper/Generated/capt-hookd tests/fixtures/capt-hookd
          cd helper
          ./gen-version-xcconfig.sh 0.0.0
          xcodegen generate
          GITHUB_REF_NAME=v0.0.0 xcodebuild test -project CaptainHook.xcodeproj -scheme CaptainHook \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/python-tests
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build + smoke-test wheel in a fresh venv
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/capt-hook --help
          test -x .wheel-smoke/bin/hook
          test -x .wheel-smoke/bin/hookd
          # This venv resolves dependencies from the index, not uv.lock, so it is the only
          # CI environment shaped like a release install. `capt-hook mcp` must speak protocol
          # here: an `mcp` major the lock never tested is exactly how the server shipped dead.
          .wheel-smoke/bin/python - .wheel-smoke/bin/capt-hook <<'PY'
          import json, subprocess, sys, threading

          proc = subprocess.Popen([sys.argv[1], "mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          # Non-daemon, so leaving it armed after a pass stalls every matrix job for its full delay.
          watchdog = threading.Timer(120, proc.kill)
          watchdog.start()


          def send(message):
              proc.stdin.write(json.dumps(message) + "\n")
              proc.stdin.flush()


          def receive(method):
              line = proc.stdout.readline()
              if not line:
                  raise SystemExit(f"capt-hook mcp closed stdout during {method} (traceback above)")
              return json.loads(line)


          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2025-06-18", "capabilities": {},
              "clientInfo": {"name": "wheel-smoke", "version": "1"}}})
          init = receive("initialize")
          send({"jsonrpc": "2.0", "method": "notifications/initialized", "params": {}})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}})
          listed = receive("tools/list")
          proc.terminate()
          proc.wait(timeout=30)
          watchdog.cancel()

          assert init["result"]["serverInfo"]["name"] == "capt-hook", init
          assert [t["name"] for t in listed["result"]["tools"]] == ["register_transcript"], listed
          print("MCP liveness OK")
          PY
          # The thin client must stay stdlib-pure: importing it may pull in neither
          # captain_hook.* nor any third-party module before it execs the signed host.
          .wheel-smoke/bin/python -c 'import sys; b=set(sys.modules); import capt_hook_client.client; new=set(sys.modules)-b; std=set(sys.stdlib_module_names); cap=sorted(m for m in new if m.startswith("captain_hook")); bad=sorted(m for m in new if m.split(".")[0] not in std and not m.startswith("capt_hook_client")); assert not cap, f"client imported captain_hook: {cap}"; assert not bad, f"client imported non-stdlib: {bad}"; print("client purity OK")'
          unzip -l dist/*.whl | grep -q 'capt_hook_client/client.py'
          if unzip -l dist/*.whl | grep -q 'capt_hook_client/key.py'; then exit 1; fi
          unzip -l dist/*.whl | grep -q 'captain_hook/langs.py'
          if unzip -l dist/*.whl | grep -q 'captain_hook/exports.py'; then exit 1; fi
          unzip -l dist/*.whl | grep -q 'captain_hook/skills/.*/SKILL.md'
          unzip -l dist/*.whl | grep -q 'captain_hook/.claude-plugin/plugin.json'
          # Only the NLP builtins carry a pack.toml descriptor; every builtin ships its hooks/ payload.
          unzip -l dist/*.whl | grep -q 'captain_hook/builtin_packs/general/pack.toml'
          unzip -l dist/*.whl | grep -q 'captain_hook/builtin_packs/steering/pack.toml'
          unzip -l dist/*.whl | grep -qE 'captain_hook/builtin_packs/general/hooks/[^/]+\.py'
          unzip -l dist/*.whl | grep -qE 'captain_hook/builtin_packs/fixes/hooks/[^/]+\.py'
          unzip -l dist/*.whl | grep -q 'captain_hook/builtin_packs/general/hooks/prompts/'
          if unzip -l dist/*.whl | grep -q 'stress/'; then exit 1; fi
          if tar tzf dist/*.tar.gz | grep -q '/stress/'; then exit 1; fi
          smoke_proj="$(mktemp -d)"
          (cd "$smoke_proj" && "$GITHUB_WORKSPACE/.wheel-smoke/bin/capt-hook" skills install)
          grep -q '"captain-hook@captain-hook": true' "$smoke_proj/.claude/settings.json"
          test ! -e "$smoke_proj/.claude/skills"

  descriptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5

      - name: Parse-validate the binrun descriptor
        # GOSUMDB/GOPROXY: the binrun module is public but not yet indexed by the
        # checksum DB; fetch it directly instead of through sum.golang.org.
        env:
          GOSUMDB: "off"
          GOPROXY: direct
        run: go run github.com/yasyf/binrun/cmd/binrun@v0.1.1 -- parse captain_hook/bin/hook.binrun
