name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      # The spacy pipeline (~/.cache/spacy/models, via ensure_spacy_model) and
      # the wordnet lexicon (~/.wn_data) live outside the venv, so the restored
      # cache survives uv recreating .venv between runs. Caching .venv instead
      # poisoned the key: a sync that rebuilt the venv silently dropped the
      # model while the hit still skipped provisioning. Both assets are
      # interpreter-independent, so the key is shared across the matrix and
      # with the docs workflow. The key tracks only the locked spaCy minor —
      # model selection is per spacy minor and the wn lexicon is pinned below —
      # so unrelated lockfile churn no longer evicts the cache and re-downloads
      # from GitHub (which rate-limits, 403).
      - name: Resolve spaCy minor (cache key)
        id: spacy
        run: echo "minor=$(grep -A1 '^name = "spacy"$' uv.lock | grep '^version' | grep -o '[0-9]*\.[0-9]*' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NLP assets
        id: nlp-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/spacy/models
            ~/.wn_data
          key: nlp-v3-${{ runner.os }}-spacy-${{ steps.spacy.outputs.minor }}

      - name: Sync (dev)
        run: uv sync --extra dev

      - name: Provision NLP assets
        if: steps.nlp-cache.outputs.cache-hit != 'true'
        run: |
          uv run python -c "from captain_hook.util.model_cache import ensure_spacy_model; ensure_spacy_model()"
          uv run python -c "import wn; wn.download('oewn:2025')"

      - name: Test (pytest)
        run: uv run pytest

      - name: Build + smoke-test wheel in a fresh venv
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/capt-hook --help
          .wheel-smoke/bin/capt-hook-client --help
          # The thin client must stay stdlib-pure: importing it may pull in neither
          # captain_hook.* nor any third-party module (that import cost is what the daemon deletes).
          .wheel-smoke/bin/python -c 'import sys; b=set(sys.modules); import capt_hook_client.client; new=set(sys.modules)-b; std=set(sys.stdlib_module_names); cap=sorted(m for m in new if m.startswith("captain_hook")); bad=sorted(m for m in new if m.split(".")[0] not in std and not m.startswith("capt_hook_client")); assert not cap, f"client imported captain_hook: {cap}"; assert not bad, f"client imported non-stdlib: {bad}"; print("client purity OK")'
          unzip -l dist/*.whl | grep -q 'capt_hook_client/client.py'
          unzip -l dist/*.whl | grep -q 'capt_hook_client/key.py'
          unzip -l dist/*.whl | grep -q 'captain_hook/skills/.*/SKILL.md'
          unzip -l dist/*.whl | grep -q 'captain_hook/.claude-plugin/plugin.json'
          unzip -l dist/*.whl | grep -q 'captain_hook/packs/general/capt-hook.toml'
          unzip -l dist/*.whl | grep -q 'captain_hook/packs/python/capt-hook.toml'
          unzip -l dist/*.whl | grep -q 'captain_hook/packs/fixes/capt-hook.toml'
          unzip -l dist/*.whl | grep -qE 'captain_hook/packs/general/[^/]+\.py'
          ! unzip -l dist/*.whl | grep -q 'stress/'
          ! tar tzf dist/*.tar.gz | grep -q '/stress/'
          smoke_proj="$(mktemp -d)"
          (cd "$smoke_proj" && "$GITHUB_WORKSPACE/.wheel-smoke/bin/capt-hook" skills install)
          grep -q '"captain-hook@captain-hook": true' "$smoke_proj/.claude/settings.json"
          ! test -e "$smoke_proj/.claude/skills"
          (cd "$smoke_proj" && "$GITHUB_WORKSPACE/.wheel-smoke/bin/capt-hook" pack add general)
          grep -q '\[packs.general\]' "$smoke_proj/.claude/hooks/packs.toml"
