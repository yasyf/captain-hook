name: Release (PyPI)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-pypi-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-tests
        with:
          python-version: "3.13"

  build:
    needs: release-tests
    uses: yasyf/homebrew-tap/.github/workflows/release-pypi-build.yml@41f8de6765b3b833ef333b0b98f5683f0e46685b
    secrets: inherit
    with:
      dist-name: capt-hook
      python-version: "3.13"
      check-version: false
      run-tests: false

  python-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Verify the exact Python release assets
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t wheels < <(printf '%s\n' "${assets[@]}" | grep -E '\.whl$')
          mapfile -t sdists < <(printf '%s\n' "${assets[@]}" | grep -E '\.tar\.gz$')
          test "${#assets[@]}" = 2
          test "${#wheels[@]}" = 1
          test "${#sdists[@]}" = 1

          uv run --no-project --with packaging python - "$TAG" <<'PY'
          import json
          import sys
          import urllib.request

          from packaging.version import Version

          target = Version(sys.argv[1].removeprefix("v"))
          with urllib.request.urlopen("https://pypi.org/pypi/capt-hook/json") as response:
              latest = Version(json.load(response)["info"]["version"])
          if target < latest:
              raise SystemExit(f"::error::release {target} is older than PyPI {latest}")
          print(f"PyPI registry permits {target} (latest: {latest})")
          PY

      - name: Smoke-test the built wheel
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          uv venv --seed .release-smoke
          uv pip install --python .release-smoke/bin/python dist/*.whl
          .release-smoke/bin/capt-hook --help >/dev/null
          test -x .release-smoke/bin/hook
          test -x .release-smoke/bin/hookd
          .release-smoke/bin/python - "$TAG" <<'PY'
          import importlib.metadata
          import sys

          assert importlib.metadata.version("capt-hook") == sys.argv[1].removeprefix("v")
          PY

  helper-version:
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.derive.outputs.marketing }}
      stable: ${{ steps.derive.outputs.stable }}
    steps:
      - id: derive
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "marketing=${v%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  helper:
    needs: [build, python-assets, helper-version]
    permissions:
      contents: read
    uses: yasyf/homebrew-tap/.github/workflows/release-app.yml@41f8de6765b3b833ef333b0b98f5683f0e46685b
    with:
      app_name: Captain Hook
      asset_name: captain-hook
      project_dir: helper
      scheme: CaptainHook
      bundle_id: com.yasyf.capt-hook.helper
      appexes: Contents/PlugIns/CaptainHookWidget.appex
      marketing_version: ${{ needs.helper-version.outputs.marketing }}
      app_groups: |
        com.yasyf.capt-hook.helper=SXKCTF23Q2.com.yasyf.capt-hook.helper
        com.yasyf.capt-hook.helper.widget=SXKCTF23Q2.com.yasyf.capt-hook.helper
      profile_names: |
        com.yasyf.capt-hook.helper=Captain Hook Helper App
        com.yasyf.capt-hook.helper.widget=Captain Hook Helper Widget
      assert_script: helper/scripts/assert-signed-bridge.sh
      go_version: 1.26.5
      prebuild_script: helper/scripts/build-capt-hookd.sh
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  stage-release:
    needs: [build, python-assets, helper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs['release-id'] }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: python-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.helper.outputs.artifact_name }}
          path: helper-artifact

      - name: Assemble the exact complete release
        env:
          HELPER_ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          HELPER_ASSET_URL: ${{ needs.helper.outputs.asset_url }}
          HELPER_SHA256: ${{ needs.helper.outputs.sha256 }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          mapfile -t python_assets < <(find python-artifacts -maxdepth 1 -type f | LC_ALL=C sort)
          mapfile -t wheels < <(printf '%s\n' "${python_assets[@]}" | grep -E '\.whl$')
          mapfile -t sdists < <(printf '%s\n' "${python_assets[@]}" | grep -E '\.tar\.gz$')
          test "${#python_assets[@]}" = 2
          test "${#wheels[@]}" = 1
          test "${#sdists[@]}" = 1
          cp "${python_assets[@]}" dist/

          mapfile -t helper_assets < <(find helper-artifact -type f -name "$HELPER_ASSET_FILENAME")
          test "${#helper_assets[@]}" = 1
          helper_sidecar="${helper_assets[0]}.sha256"
          test -f "$helper_sidecar"
          cp "${helper_assets[0]}" "dist/$HELPER_ASSET_FILENAME"
          cp "$helper_sidecar" "dist/$HELPER_ASSET_FILENAME.sha256"
          (cd dist && sha256sum -c "$HELPER_ASSET_FILENAME.sha256")
          test "$(sha256sum "dist/$HELPER_ASSET_FILENAME" | awk '{print $1}')" = "$HELPER_SHA256"
          test "$HELPER_ASSET_URL" = \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${HELPER_ASSET_FILENAME}"

          checksums="$(mktemp)"
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum) > "$checksums"
          mv "$checksums" dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      - name: Record the exact complete release manifest
        run: find dist -maxdepth 1 -type f | LC_ALL=C sort > "$RUNNER_TEMP/captain-release-assets"

      - name: Stage and verify the exact complete draft
        id: draft
        uses: yasyf/homebrew-tap/.github/actions/stage-draft-release@e4c3108e693681df1a3c666bae80e890bc44cf3e
        with:
          token: ${{ github.token }}
          tag: ${{ needs.build.outputs.tag }}
          manifest: ${{ runner.temp }}/captain-release-assets
          title: ${{ needs.build.outputs.tag }}
          prerelease: ${{ contains(needs.build.outputs.tag, '-') }}

      - name: Preserve the exact verified staged bytes
        uses: actions/upload-artifact@v7
        with:
          name: staged-release-${{ steps.draft.outputs['release-id'] }}
          path: ${{ steps.draft.outputs['download-dir'] }}/*
          if-no-files-found: error

  smoke-draft:
    needs: [build, helper, stage-release]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: staged-release-${{ needs.stage-release.outputs.release_id }}
          path: released

      - name: Smoke-test the final staged application bytes
        env:
          ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          ASSET_SHA256: ${{ needs.helper.outputs.sha256 }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir unpacked
          test "$(awk 'NR == 1 { print $1 }' "released/$ASSET_FILENAME.sha256")" = "$ASSET_SHA256"
          test "$(shasum -a 256 "released/$ASSET_FILENAME" | awk '{print $1}')" = "$ASSET_SHA256"
          ditto -x -k "released/$ASSET_FILENAME" unpacked
          app="unpacked/Captain Hook.app"
          test -d "$app"
          codesign --verify --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          APP_PATH="$app" CAPT_HOOK_VERSION="${RELEASE_TAG#v}" bash helper/scripts/assert-signed-bridge.sh

  # PyPI Trusted Publishing must run in this repository's workflow so its OIDC
  # job_workflow_ref matches the configured publisher. The GitHub draft becomes
  # public only after PyPI exposes the exact staged Python bytes.
  publish-pypi:
    needs: [build, stage-release, smoke-draft]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: python-dist

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-dist

      - name: Match the PyPI upload to the staged release
        run: |
          set -euo pipefail
          mapfile -t python_assets < <(find python-dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          test "${#python_assets[@]}" = 2
          manifest="$RUNNER_TEMP/captain-pypi-assets.tsv"
          : > "$manifest"
          for asset in "${python_assets[@]}"; do
            test -f "release-dist/$asset"
            python_sha="$(sha256sum "python-dist/$asset" | awk '{print $1}')"
            staged_sha="$(sha256sum "release-dist/$asset" | awk '{print $1}')"
            test "$python_sha" = "$staged_sha"
            printf '%s\t%s\n' "$staged_sha" "$asset" >> "$manifest"
          done

      - name: Resolve the exact PyPI publication state
        id: pypi-state
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "${VERSION#v}" "$RUNNER_TEMP/captain-pypi-assets.tsv" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          version, manifest, output = sys.argv[1:]
          expected = {
              name: digest
              for digest, name in (
                  line.split("\t", 1)
                  for line in pathlib.Path(manifest).read_text().splitlines()
              )
          }
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/capt-hook/{version}/json") as response:
                  urls = json.load(response)["urls"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              with pathlib.Path(output).open("a") as stream:
                  stream.write("publish=true\n")
              raise SystemExit

          actual = {item["filename"]: item["digests"]["sha256"] for item in urls}
          if actual != expected:
              raise SystemExit(f"::error::existing PyPI assets differ: expected {expected}, got {actual}")
          with pathlib.Path(output).open("a") as stream:
              stream.write("publish=false\n")
          print("PyPI already contains the exact staged Python assets")
          PY

      # v1.14.2 — its Twine 7 bump is what accepts the metadata 2.5 uv now emits; v1.14.1 rejects it.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: ${{ steps.pypi-state.outputs.publish == 'true' }}
        with:
          packages-dir: python-dist

      - name: Verify exact PyPI publication
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "${VERSION#v}" "$RUNNER_TEMP/captain-pypi-assets.tsv" <<'PY'
          import json
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          version, manifest = sys.argv[1:]
          expected = {
              name: digest
              for digest, name in (
                  line.split("\t", 1)
                  for line in pathlib.Path(manifest).read_text().splitlines()
              )
          }
          actual = {}
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/capt-hook/{version}/json") as response:
                      urls = json.load(response)["urls"]
                  actual = {item["filename"]: item["digests"]["sha256"] for item in urls}
                  if actual == expected:
                      break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if attempt == 11:
                  raise SystemExit(f"::error::PyPI assets differ: expected {expected}, got {actual}")
              time.sleep(5)
          PY

  publish-github:
    needs: [build, stage-release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-dist

      - name: Record the exact complete release manifest
        run: find release-dist -maxdepth 1 -type f | LC_ALL=C sort > "$RUNNER_TEMP/captain-release-assets"

      - name: Publish the exact already-complete GitHub draft
        uses: yasyf/homebrew-tap/.github/actions/publish-draft-release@54e3e194bda69896894a82c17fcdb2822beefab5
        with:
          token: ${{ github.token }}
          release-id: ${{ needs.stage-release.outputs.release_id }}
          tag: ${{ needs.build.outputs.tag }}
          manifest: ${{ runner.temp }}/captain-release-assets
          prerelease: ${{ contains(needs.build.outputs.tag, '-') }}
          make-latest: ${{ !contains(needs.build.outputs.tag, '-') }}

  # Consumer plugin caches refresh only when plugin.json's version increases.
  sync-plugin-version:
    needs: publish-github
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Sync plugin.json version to the released tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          FILE=captain_hook/.claude-plugin/plugin.json

          python3 - "$VERSION" "$FILE" <<'PY'
          import json, pathlib, re, sys
          target, path = sys.argv[1], pathlib.Path(sys.argv[2])
          text = path.read_text()
          if json.loads(text)["version"] == target:
              sys.exit(0)
          new = re.sub(r'(^\s*"version":\s*")[^"]*(")', rf'\g<1>{target}\g<2>', text, count=1, flags=re.M)
          assert json.loads(new)["version"] == target, "version substitution did not take"
          path.write_text(new)
          PY

          if git diff --quiet -- "$FILE"; then
            echo "plugin.json already at $VERSION; nothing to sync"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(release): sync plugin.json to $VERSION [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "pushed plugin.json sync on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt)"
          done
          echo "::error::failed to push plugin.json sync after 3 attempts"
          exit 1

  helper-formula:
    needs: [helper-version, helper, publish-github, sync-plugin-version]
    if: ${{ needs.helper-version.outputs.stable == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify the exact application release output
        env:
          ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          ASSET_URL: ${{ needs.helper.outputs.asset_url }}
          ASSET_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          set -euo pipefail
          expected_filename="captain-hook-${GITHUB_REF_NAME}-darwin.zip"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${expected_filename}"
          [ "$ASSET_FILENAME" = "$expected_filename" ] \
            || { echo "::error::verified app filename '$ASSET_FILENAME' != '$expected_filename'"; exit 1; }
          [ "$ASSET_URL" = "$expected_url" ] \
            || { echo "::error::verified app URL does not name the exact release asset"; exit 1; }
          [[ "$ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::verified app SHA-256 is malformed"; exit 1; }

      - name: Verify the final distributed application bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          ASSET_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist/released
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/released --pattern "$ASSET_FILENAME" --pattern "$ASSET_FILENAME.sha256"
          cd dist/released
          [ "$(awk 'NR == 1 { print $1 }' "$ASSET_FILENAME.sha256")" = "$ASSET_SHA256" ]
          [ "$(shasum -a 256 "$ASSET_FILENAME" | awk '{print $1}')" = "$ASSET_SHA256" ]

      - name: Guard formula registry name and version
        env:
          FORMULA_TOKEN: captain-hook
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          tmp="$(mktemp -d)"

          fetch() {
            url="$1"
            output="$2"
            if ! code="$(curl --connect-timeout 15 --max-time 45 -sS -o "$output" -w '%{http_code}' "$url")"; then
              echo "::error::registry guard could not reach $url; refusing to release blind"
              exit 1
            fi
            case "$code" in
              200|404) printf '%s' "$code" ;;
              *) echo "::error::registry guard got HTTP $code from $url; refusing to release blind"; exit 1 ;;
            esac
          }

          formula_url="https://raw.githubusercontent.com/yasyf/homebrew-tap/main/Formula/${FORMULA_TOKEN}.rb"
          formula_code="$(fetch "$formula_url" "$tmp/formula.rb")"
          if [ "$formula_code" = "200" ]; then
            grep -Eq "^class[[:space:]]+CaptainHook[[:space:]]+<[[:space:]]+Formula" "$tmp/formula.rb" \
              || { echo "::error::the registered Formula/${FORMULA_TOKEN}.rb declares a different formula"; exit 1; }
            current="$(sed -n 's/^[[:space:]]*version[[:space:]]*"\([0-9][0-9.]*\)".*/\1/p' "$tmp/formula.rb" | sed -n '1p')"
            [ -n "$current" ] \
              || { echo "::error::could not parse the registered formula version"; exit 1; }
            first="$(printf '%s\n%s\n' "$current" "$version" | sort -V | sed -n '1p')"
            if [ "$first" = "$version" ] && [ "$current" != "$version" ]; then
              echo "::error::release version $version is older than registered formula version $current"
              exit 1
            fi
          fi

          cask_url="https://raw.githubusercontent.com/yasyf/homebrew-tap/main/Casks/${FORMULA_TOKEN}.rb"
          cask_code="$(fetch "$cask_url" "$tmp/cask.rb")"
          if [ "$cask_code" != "404" ]; then
            echo "::error::legacy Casks/${FORMULA_TOKEN}.rb must be removed before publishing the hard-cut formula"
            exit 1
          fi

      - name: Require the bundled signed application formula
        run: |
          set -euo pipefail
          template=.github/formula/captain-hook.rb.tmpl
          grep -Fq 'libexec.install "Captain Hook.app"' "$template"
          grep -Fq '"package-install"' "$template"
          grep -Fq '$HOME/Applications/Captain Hook.app' "$template"
          ! grep -Eq '^[[:space:]]*cask[[:space:]]+' "$template"
          ! grep -Eq '(^|[^$~[:alnum:]_])/Applications/Captain Hook\.app' "$template"

      - name: Render the formula from the verified release output
        uses: yasyf/homebrew-tap/.github/actions/render-formula@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          template: .github/formula/captain-hook.rb.tmpl
          output: Formula/captain-hook.rb
          substitutions: |
            __ASSET_URL__=${{ needs.helper.outputs.asset_url }}
            __SHA_APP__=${{ needs.helper.outputs.sha256 }}

      - name: Publish the verified bundled-application formula
        uses: yasyf/homebrew-tap/.github/actions/publish@9525763796fce4d1042cf3393d9479f791908eaa
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          dir: tap-staging
          message: "captain-hook ${{ github.ref_name }}"
