name: Release (PyPI)

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-pypi
  cancel-in-progress: false

jobs:
  build:
    uses: yasyf/homebrew-tap/.github/workflows/release-pypi-build.yml@pypi-v1
    secrets: inherit
    with:
      dist-name: capt-hook
      python-version: "3.13"

  # PyPI Trusted Publishing must run in THIS repo's workflow — it authenticates via the OIDC
  # job_workflow_ref claim, which inside a reusable workflow points at homebrew-tap, not here
  # (and PyPI does not support reusable workflows for Trusted Publishing). Running publish here
  # makes job_workflow_ref this repo's release-pypi.yml, matching the existing trusted publisher.
  publish:
    needs: [build, helper, verify-release-artifacts]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, helper, publish, sync-plugin-version, verify-release-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.helper.outputs.artifact_name }}
          path: helper-dist

      - name: Stage and publish the complete verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELPER_ASSET: ${{ needs.helper.outputs.asset_filename }}
          HELPER_SHA256: ${{ needs.helper.outputs.sha256 }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          test -f "helper-dist/$HELPER_ASSET"
          test -f "helper-dist/$HELPER_ASSET.sha256"
          [ "$(shasum -a 256 "helper-dist/$HELPER_ASSET" | awk '{print $1}')" = "$HELPER_SHA256" ]
          read -r sidecar_sha sidecar_path < "helper-dist/$HELPER_ASSET.sha256"
          [ "$sidecar_sha" = "$HELPER_SHA256" ]
          [ "$(basename "$sidecar_path")" = "$HELPER_ASSET" ]

          if state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName 2>/dev/null)"; then
            [ "$(jq -r .tagName <<<"$state")" = "$TAG" ]
            [ "$(jq -r .isDraft <<<"$state")" = true ] || {
              echo "::error::release $TAG is already public; refusing to mutate it"
              exit 1
            }
          else
            args=(--draft --title "$TAG" --generate-notes --verify-tag)
            if [[ "$TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/* helper-dist/*

          expected="$RUNNER_TEMP/expected-release-assets"
          actual="$RUNNER_TEMP/actual-release-assets"
          find dist helper-dist -maxdepth 1 -type f -exec basename {} \; | sort > "$expected"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[].name' | sort > "$actual"
          diff -u "$expected" "$actual" || {
            echo "::error::draft release does not contain the exact staged asset set"
            exit 1
          }

          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=true
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest
          fi

  # Consumer plugin caches refresh only when plugin.json's version increases, so every
  # release must advance it on main. The sync runs as its own job: a failure turns the
  # run red without blocking the already-published artifacts or the GitHub release.
  sync-plugin-version:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Sync plugin.json version to the released tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          FILE=captain_hook/.claude-plugin/plugin.json

          python3 - "$VERSION" "$FILE" <<'PY'
          import json, pathlib, re, sys
          target, path = sys.argv[1], pathlib.Path(sys.argv[2])
          text = path.read_text()
          if json.loads(text)["version"] == target:
              sys.exit(0)
          new = re.sub(r'(^\s*"version":\s*")[^"]*(")', rf'\g<1>{target}\g<2>', text, count=1, flags=re.M)
          assert json.loads(new)["version"] == target, "version substitution did not take"
          path.write_text(new)
          PY

          if git diff --quiet -- "$FILE"; then
            echo "plugin.json already at $VERSION; nothing to sync"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(release): sync plugin.json to $VERSION [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "pushed plugin.json sync on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt)"
          done
          echo "::error::failed to push plugin.json sync after 3 attempts"
          exit 1

  # Every package release carries the exact same versioned, signed application.
  # After github-release so softprops appends, not recreates.
  helper-version:
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.derive.outputs.marketing }}
      stable: ${{ steps.derive.outputs.stable }}
    steps:
      - id: derive
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "marketing=${v%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  helper:
    needs: [build, helper-version]
    permissions:
      contents: read
    uses: yasyf/homebrew-tap/.github/workflows/release-app.yml@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
    with:
      app_name: Captain Hook
      asset_name: captain-hook
      project_dir: helper
      scheme: CaptainHook
      bundle_id: com.yasyf.capt-hook.helper
      appexes: Contents/PlugIns/CaptainHookWidget.appex
      marketing_version: ${{ needs.helper-version.outputs.marketing }}
      app_groups: |
        com.yasyf.capt-hook.helper=SXKCTF23Q2.com.yasyf.capt-hook.helper
        com.yasyf.capt-hook.helper.widget=SXKCTF23Q2.com.yasyf.capt-hook.helper
      profile_names: |
        com.yasyf.capt-hook.helper=Captain Hook Helper App
        com.yasyf.capt-hook.helper.widget=Captain Hook Helper Widget
      assert_script: helper/scripts/assert-signed-bridge.sh
      go_version: 1.26.5
      prebuild_script: helper/scripts/build-capt-hookd.sh
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  verify-release-artifacts:
    needs: [build, helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.helper.outputs.artifact_name }}
          path: helper-dist
      - name: Verify the staged helper and Python artifacts
        env:
          HELPER_ASSET: ${{ needs.helper.outputs.asset_filename }}
          HELPER_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f | grep -q .
          test -f "helper-dist/$HELPER_ASSET"
          test -f "helper-dist/$HELPER_ASSET.sha256"
          [ "$(shasum -a 256 "helper-dist/$HELPER_ASSET" | awk '{print $1}')" = "$HELPER_SHA256" ]
          read -r sidecar_sha sidecar_path < "helper-dist/$HELPER_ASSET.sha256"
          [ "$sidecar_sha" = "$HELPER_SHA256" ]
          [ "$(basename "$sidecar_path")" = "$HELPER_ASSET" ]

  helper-cask:
    needs: [github-release, helper-version, helper]
    if: ${{ needs.helper-version.outputs.stable == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify the exact application release output
        env:
          ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          ASSET_URL: ${{ needs.helper.outputs.asset_url }}
          ASSET_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          set -euo pipefail
          expected_filename="captain-hook-${GITHUB_REF_NAME}-darwin.zip"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${expected_filename}"
          [ "$ASSET_FILENAME" = "$expected_filename" ] \
            || { echo "::error::verified app filename '$ASSET_FILENAME' != '$expected_filename'"; exit 1; }
          [ "$ASSET_URL" = "$expected_url" ] \
            || { echo "::error::verified app URL does not name the exact release asset"; exit 1; }
          [[ "$ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::verified app SHA-256 is malformed"; exit 1; }

      - name: Verify the final distributed application bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          ASSET_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist/released
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/released --pattern "$ASSET_FILENAME" --pattern "$ASSET_FILENAME.sha256"
          cd dist/released
          [ "$(awk 'NR == 1 { print $1 }' "$ASSET_FILENAME.sha256")" = "$ASSET_SHA256" ]
          [ "$(shasum -a 256 "$ASSET_FILENAME" | awk '{print $1}')" = "$ASSET_SHA256" ]

      - name: Guard cask registry name and version
        env:
          CASK_TOKEN: captain-hook
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          tmp="$(mktemp -d)"

          fetch() {
            url="$1"
            output="$2"
            if ! code="$(curl --connect-timeout 15 --max-time 45 -sS -o "$output" -w '%{http_code}' "$url")"; then
              echo "::error::registry guard could not reach $url; refusing to release blind"
              exit 1
            fi
            case "$code" in
              200|404) printf '%s' "$code" ;;
              *) echo "::error::registry guard got HTTP $code from $url; refusing to release blind"; exit 1 ;;
            esac
          }

          formula_url="https://raw.githubusercontent.com/yasyf/homebrew-tap/main/Formula/${CASK_TOKEN}.rb"
          formula_code="$(fetch "$formula_url" "$tmp/formula.rb")"
          if [ "$formula_code" = "200" ]; then
            echo "::error::Formula/${CASK_TOKEN}.rb already exists; a same-named cask would make brew install ambiguous"
            exit 1
          fi

          cask_url="https://raw.githubusercontent.com/yasyf/homebrew-tap/main/Casks/${CASK_TOKEN}.rb"
          cask_code="$(fetch "$cask_url" "$tmp/cask.rb")"
          if [ "$cask_code" = "404" ]; then
            exit 0
          fi
          grep -Eq "^[[:space:]]*cask[[:space:]]+\"${CASK_TOKEN}\"[[:space:]]+do" "$tmp/cask.rb" \
            || { echo "::error::the registered Casks/${CASK_TOKEN}.rb declares a different cask name"; exit 1; }
          current="$(sed -n 's/^[[:space:]]*version[[:space:]]*\"\([0-9][0-9.]*\)\".*/\1/p' "$tmp/cask.rb" | sed -n '1p')"
          [ -n "$current" ] \
            || { echo "::error::could not parse the registered version for $CASK_TOKEN"; exit 1; }
          first="$(printf '%s\n%s\n' "$current" "$version" | sort -V | sed -n '1p')"
          if [ "$first" = "$version" ] && [ "$current" != "$version" ]; then
            echo "::error::release version $version is older than registered cask version $current"
            exit 1
          fi

      - name: Require a full-application cask template
        run: |
          set -euo pipefail
          template=.github/cask/captain-hook.rb.tmpl
          grep -Eq '^[[:space:]]*app[[:space:]]+' "$template" \
            || { echo "::error::cask template must install the full .app with an app stanza"; exit 1; }
          if grep -Eq '^[[:space:]]*binary[[:space:]]+' "$template"; then
            echo "::error::cask template must not install this application as a bare binary"
            exit 1
          fi

      - name: Render the cask from the verified release output
        uses: yasyf/homebrew-tap/.github/actions/render-formula@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          template: .github/cask/captain-hook.rb.tmpl
          output: Casks/captain-hook.rb
          substitutions: |
            __ASSET_URL__=${{ needs.helper.outputs.asset_url }}
            __SHA_APP__=${{ needs.helper.outputs.sha256 }}

      - name: Publish the verified application cask
        uses: yasyf/homebrew-tap/.github/actions/publish@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          dir: tap-staging
          message: "captain-hook ${{ github.ref_name }}"
