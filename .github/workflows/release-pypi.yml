name: Release (PyPI)

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-pypi
  cancel-in-progress: false

jobs:
  build:
    uses: yasyf/homebrew-tap/.github/workflows/release-pypi-build.yml@8f422c652d836c40f9cc5a9d893d4120b26bc681
    secrets: inherit
    with:
      dist-name: capt-hook
      python-version: "3.13"
      check-version: false
      run-tests: true

  python-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Verify the exact Python release assets
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t wheels < <(printf '%s\n' "${assets[@]}" | grep -E '\.whl$')
          mapfile -t sdists < <(printf '%s\n' "${assets[@]}" | grep -E '\.tar\.gz$')
          test "${#assets[@]}" = 2
          test "${#wheels[@]}" = 1
          test "${#sdists[@]}" = 1

          uv run --no-project --with packaging python - "$TAG" <<'PY'
          import json
          import sys
          import urllib.request

          from packaging.version import Version

          target = Version(sys.argv[1].removeprefix("v"))
          with urllib.request.urlopen("https://pypi.org/pypi/capt-hook/json") as response:
              latest = Version(json.load(response)["info"]["version"])
          if target < latest:
              raise SystemExit(f"::error::release {target} is older than PyPI {latest}")
          print(f"PyPI registry permits {target} (latest: {latest})")
          PY

      - name: Smoke-test the built wheel
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          uv venv --seed .release-smoke
          uv pip install --python .release-smoke/bin/python dist/*.whl
          .release-smoke/bin/capt-hook --help >/dev/null
          test -x .release-smoke/bin/hook
          test -x .release-smoke/bin/hookd
          .release-smoke/bin/python - "$TAG" <<'PY'
          import importlib.metadata
          import sys

          assert importlib.metadata.version("capt-hook") == sys.argv[1].removeprefix("v")
          PY

  helper-version:
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.derive.outputs.marketing }}
      stable: ${{ steps.derive.outputs.stable }}
    steps:
      - id: derive
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "marketing=${v%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

  helper:
    needs: [build, python-assets, helper-version]
    permissions:
      contents: read
    uses: yasyf/homebrew-tap/.github/workflows/release-app.yml@8f422c652d836c40f9cc5a9d893d4120b26bc681
    with:
      app_name: Captain Hook
      asset_name: captain-hook
      project_dir: helper
      scheme: CaptainHook
      bundle_id: com.yasyf.capt-hook.helper
      appexes: Contents/PlugIns/CaptainHookWidget.appex
      marketing_version: ${{ needs.helper-version.outputs.marketing }}
      app_groups: |
        com.yasyf.capt-hook.helper=SXKCTF23Q2.com.yasyf.capt-hook.helper
        com.yasyf.capt-hook.helper.widget=SXKCTF23Q2.com.yasyf.capt-hook.helper
      profile_names: |
        com.yasyf.capt-hook.helper=Captain Hook Helper App
        com.yasyf.capt-hook.helper.widget=Captain Hook Helper Widget
      assert_script: helper/scripts/assert-signed-bridge.sh
      go_version: 1.26.5
      prebuild_script: helper/scripts/build-capt-hookd.sh
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  stage-release:
    needs: [build, python-assets, helper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: python-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.helper.outputs.artifact_name }}
          path: helper-artifact

      - name: Assemble the exact complete release
        env:
          HELPER_ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          HELPER_ASSET_URL: ${{ needs.helper.outputs.asset_url }}
          HELPER_SHA256: ${{ needs.helper.outputs.sha256 }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          mapfile -t python_assets < <(find python-artifacts -maxdepth 1 -type f | LC_ALL=C sort)
          mapfile -t wheels < <(printf '%s\n' "${python_assets[@]}" | grep -E '\.whl$')
          mapfile -t sdists < <(printf '%s\n' "${python_assets[@]}" | grep -E '\.tar\.gz$')
          test "${#python_assets[@]}" = 2
          test "${#wheels[@]}" = 1
          test "${#sdists[@]}" = 1
          cp "${python_assets[@]}" dist/

          mapfile -t helper_assets < <(find helper-artifact -type f -name "$HELPER_ASSET_FILENAME")
          test "${#helper_assets[@]}" = 1
          helper_sidecar="${helper_assets[0]}.sha256"
          test -f "$helper_sidecar"
          cp "${helper_assets[0]}" "dist/$HELPER_ASSET_FILENAME"
          cp "$helper_sidecar" "dist/$HELPER_ASSET_FILENAME.sha256"
          (cd dist && sha256sum -c "$HELPER_ASSET_FILENAME.sha256")
          test "$(sha256sum "dist/$HELPER_ASSET_FILENAME" | awk '{print $1}')" = "$HELPER_SHA256"
          test "$HELPER_ASSET_URL" = \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${HELPER_ASSET_FILENAME}"

          checksums="$(mktemp)"
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum) > "$checksums"
          mv "$checksums" dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      - name: Create or refresh the caller-owned draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t releases < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | [.id, .draft] | @tsv'
          )
          test "${#releases[@]}" -le 1
          state=missing
          if [ "${#releases[@]}" = 1 ]; then
            state="${releases[0]#*$'\t'}"
          fi

          case "$state" in
            missing)
              args=(--title "$RELEASE_TAG" --generate-notes --draft --verify-tag)
              [[ "$RELEASE_TAG" == *-* ]] && args+=(--prerelease)
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
              state=true
              ;;
            true|false) ;;
            *) echo "::error::release $RELEASE_TAG returned invalid draft state '$state'"; exit 1 ;;
          esac

          if [ "$state" = true ]; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          fi

          expected="$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          actual="$(find "$verify_dir" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          test "$actual" = "$expected" \
            || { echo "::error::release assets do not exactly match the verified dist"; exit 1; }
          while IFS= read -r asset; do
            test "$(sha256sum "dist/$asset" | awk '{print $1}')" = \
              "$(sha256sum "$verify_dir/$asset" | awk '{print $1}')" \
              || { echo "::error::release asset '$asset' differs from the verified dist"; exit 1; }
          done <<< "$expected"

  smoke-draft:
    needs: [build, helper, stage-release]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Smoke-test the final staged application bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          ASSET_SHA256: ${{ needs.helper.outputs.sha256 }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir released unpacked
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir released \
            --pattern "$ASSET_FILENAME" --pattern "$ASSET_FILENAME.sha256"
          test "$(awk 'NR == 1 { print $1 }' "released/$ASSET_FILENAME.sha256")" = "$ASSET_SHA256"
          test "$(shasum -a 256 "released/$ASSET_FILENAME" | awk '{print $1}')" = "$ASSET_SHA256"
          ditto -x -k "released/$ASSET_FILENAME" unpacked
          app="unpacked/Captain Hook.app"
          test -d "$app"
          codesign --verify --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          APP_PATH="$app" CAPT_HOOK_VERSION="${RELEASE_TAG#v}" bash helper/scripts/assert-signed-bridge.sh

  # PyPI Trusted Publishing must run in this repository's workflow so its OIDC
  # job_workflow_ref matches the configured publisher. The GitHub draft becomes
  # public only after PyPI exposes the exact staged Python bytes.
  publish-pypi:
    needs: [build, stage-release, smoke-draft]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: python-dist

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-dist

      - name: Match the PyPI upload to the staged release
        run: |
          set -euo pipefail
          mapfile -t python_assets < <(find python-dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          test "${#python_assets[@]}" = 2
          for asset in "${python_assets[@]}"; do
            test -f "release-dist/$asset"
            test "$(sha256sum "python-dist/$asset" | awk '{print $1}')" = \
              "$(sha256sum "release-dist/$asset" | awk '{print $1}')"
          done

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          packages-dir: python-dist
          skip-existing: true

      - name: Verify exact PyPI publication
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "${VERSION#v}" python-dist <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          version, directory = sys.argv[1:]
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path(directory).iterdir()
              if path.is_file()
          }
          actual = {}
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/capt-hook/{version}/json") as response:
                      urls = json.load(response)["urls"]
                  actual = {item["filename"]: item["digests"]["sha256"] for item in urls}
                  if actual == expected:
                      break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if attempt == 11:
                  raise SystemExit(f"::error::PyPI assets differ: expected {expected}, got {actual}")
              time.sleep(5)
          PY

  publish-github:
    needs: [build, stage-release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-dist

      - name: Publish the already-complete GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          expected="$(find release-dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          actual="$(find "$verify_dir" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          test "$actual" = "$expected"
          while IFS= read -r asset; do
            test "$(sha256sum "release-dist/$asset" | awk '{print $1}')" = \
              "$(sha256sum "$verify_dir/$asset" | awk '{print $1}')"
          done <<< "$expected"

          mapfile -t releases < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | [.id, .draft] | @tsv'
          )
          test "${#releases[@]}" = 1
          state="${releases[0]#*$'\t'}"
          case "$state" in
            true) gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false ;;
            false) echo "release $RELEASE_TAG is already public with the exact verified assets" ;;
            *) echo "::error::release $RELEASE_TAG returned invalid draft state '$state'"; exit 1 ;;
          esac

  # Consumer plugin caches refresh only when plugin.json's version increases.
  sync-plugin-version:
    needs: publish-github
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Sync plugin.json version to the released tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          FILE=captain_hook/.claude-plugin/plugin.json

          python3 - "$VERSION" "$FILE" <<'PY'
          import json, pathlib, re, sys
          target, path = sys.argv[1], pathlib.Path(sys.argv[2])
          text = path.read_text()
          if json.loads(text)["version"] == target:
              sys.exit(0)
          new = re.sub(r'(^\s*"version":\s*")[^"]*(")', rf'\g<1>{target}\g<2>', text, count=1, flags=re.M)
          assert json.loads(new)["version"] == target, "version substitution did not take"
          path.write_text(new)
          PY

          if git diff --quiet -- "$FILE"; then
            echo "plugin.json already at $VERSION; nothing to sync"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(release): sync plugin.json to $VERSION [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "pushed plugin.json sync on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt)"
          done
          echo "::error::failed to push plugin.json sync after 3 attempts"
          exit 1

  helper-cask:
    needs: [helper-version, helper, publish-github, sync-plugin-version]
    if: ${{ needs.helper-version.outputs.stable == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify the exact application release output
        env:
          ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          ASSET_URL: ${{ needs.helper.outputs.asset_url }}
          ASSET_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          set -euo pipefail
          expected_filename="captain-hook-${GITHUB_REF_NAME}-darwin.zip"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${expected_filename}"
          [ "$ASSET_FILENAME" = "$expected_filename" ] \
            || { echo "::error::verified app filename '$ASSET_FILENAME' != '$expected_filename'"; exit 1; }
          [ "$ASSET_URL" = "$expected_url" ] \
            || { echo "::error::verified app URL does not name the exact release asset"; exit 1; }
          [[ "$ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::verified app SHA-256 is malformed"; exit 1; }

      - name: Verify the final distributed application bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ needs.helper.outputs.asset_filename }}
          ASSET_SHA256: ${{ needs.helper.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist/released
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/released --pattern "$ASSET_FILENAME" --pattern "$ASSET_FILENAME.sha256"
          cd dist/released
          [ "$(awk 'NR == 1 { print $1 }' "$ASSET_FILENAME.sha256")" = "$ASSET_SHA256" ]
          [ "$(shasum -a 256 "$ASSET_FILENAME" | awk '{print $1}')" = "$ASSET_SHA256" ]

      - name: Guard cask registry name and version
        env:
          CASK_TOKEN: captain-hook
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          tmp="$(mktemp -d)"

          fetch() {
            url="$1"
            output="$2"
            if ! code="$(curl --connect-timeout 15 --max-time 45 -sS -o "$output" -w '%{http_code}' "$url")"; then
              echo "::error::registry guard could not reach $url; refusing to release blind"
              exit 1
            fi
            case "$code" in
              200|404) printf '%s' "$code" ;;
              *) echo "::error::registry guard got HTTP $code from $url; refusing to release blind"; exit 1 ;;
            esac
          }

          formula_url="https://raw.githubusercontent.com/yasyf/homebrew-tap/main/Formula/${CASK_TOKEN}.rb"
          formula_code="$(fetch "$formula_url" "$tmp/formula.rb")"
          if [ "$formula_code" = "200" ]; then
            echo "::error::Formula/${CASK_TOKEN}.rb already exists; a same-named cask would make brew install ambiguous"
            exit 1
          fi

          cask_url="https://raw.githubusercontent.com/yasyf/homebrew-tap/main/Casks/${CASK_TOKEN}.rb"
          cask_code="$(fetch "$cask_url" "$tmp/cask.rb")"
          if [ "$cask_code" = "404" ]; then
            exit 0
          fi
          grep -Eq "^[[:space:]]*cask[[:space:]]+\"${CASK_TOKEN}\"[[:space:]]+do" "$tmp/cask.rb" \
            || { echo "::error::the registered Casks/${CASK_TOKEN}.rb declares a different cask name"; exit 1; }
          current="$(sed -n 's/^[[:space:]]*version[[:space:]]*\"\([0-9][0-9.]*\)\".*/\1/p' "$tmp/cask.rb" | sed -n '1p')"
          [ -n "$current" ] \
            || { echo "::error::could not parse the registered version for $CASK_TOKEN"; exit 1; }
          first="$(printf '%s\n%s\n' "$current" "$version" | sort -V | sed -n '1p')"
          if [ "$first" = "$version" ] && [ "$current" != "$version" ]; then
            echo "::error::release version $version is older than registered cask version $current"
            exit 1
          fi

      - name: Require a full-application cask template
        run: |
          set -euo pipefail
          template=.github/cask/captain-hook.rb.tmpl
          grep -Eq '^[[:space:]]*app[[:space:]]+' "$template" \
            || { echo "::error::cask template must install the full .app with an app stanza"; exit 1; }
          if grep -Eq '^[[:space:]]*binary[[:space:]]+' "$template"; then
            echo "::error::cask template must not install this application as a bare binary"
            exit 1
          fi

      - name: Render the cask from the verified release output
        uses: yasyf/homebrew-tap/.github/actions/render-formula@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          template: .github/cask/captain-hook.rb.tmpl
          output: Casks/captain-hook.rb
          substitutions: |
            __ASSET_URL__=${{ needs.helper.outputs.asset_url }}
            __SHA_APP__=${{ needs.helper.outputs.sha256 }}

      - name: Publish the verified application cask
        uses: yasyf/homebrew-tap/.github/actions/publish@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          dir: tap-staging
          message: "captain-hook ${{ github.ref_name }}"
