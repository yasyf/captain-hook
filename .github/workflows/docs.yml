name: Documentation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          cache-dependency-glob: uv.lock

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # The spacy pipeline (~/.cache/spacy/models, via ensure_spacy_model) and
      # the wordnet lexicon (~/.wn_data) live outside the venv, so the restored
      # cache survives uv recreating .venv between runs. Caching .venv instead
      # poisoned the key: a sync that rebuilt the venv silently dropped the
      # model while the hit still skipped provisioning. The key is shared with
      # the CI workflow — the assets are identical and interpreter-independent.
      - name: Cache NLP assets
        id: nlp-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/spacy/models
            ~/.wn_data
          key: nlp-v2-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Sync (docs)
        run: uv sync --group docs

      - name: Provision NLP assets
        if: steps.nlp-cache.outputs.cache-hit != 'true'
        run: |
          uv run python -c "from captain_hook.util.model_cache import ensure_spacy_model; ensure_spacy_model()"
          uv run python -c "import wn; wn.download('oewn:2025')"

      - name: Build documentation
        run: uv run great-docs build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

  publish-docs:
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
