# GENERATED by cc-guides from .claude/fragments/.github/workflows/docs.yml/ — do not edit; edit the fragments and push — CI renders.
name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "captain_hook/**"
      - "great-docs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          cache-dependency-glob: uv.lock

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # The spacy pipeline (~/.cache/spacy/models, via ensure_spacy_model) and
      # the wordnet lexicon (~/.wn_data) live outside the venv, so the restored
      # cache survives uv recreating .venv between runs. Caching .venv instead
      # poisoned the key: a sync that rebuilt the venv silently dropped the
      # model while the hit still skipped provisioning. The key is shared with
      # the CI workflow — the assets are identical and interpreter-independent —
      # and tracks the locked spaCy minor and pinned Open English WordNet
      # digest, so unrelated lockfile churn no longer evicts the cache and
      # re-downloads from GitHub (which rate-limits).
      - name: Resolve spaCy minor (cache key)
        id: spacy
        run: echo "minor=$(grep -A1 '^name = "spacy"$' uv.lock | grep '^version' | grep -o '[0-9]*\.[0-9]*' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NLP assets
        id: nlp-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/spacy/models
            ~/.wn_data
          key: nlp-v5-${{ runner.os }}-spacy-${{ steps.spacy.outputs.minor }}-oewn-31f4af16c54b532fd5484d4cc33aee588a31bb5b70683ae8197842fde5b586bc

      - name: Sync (docs)
        run: uv sync --group docs

      - name: Provision NLP assets
        if: steps.nlp-cache.outputs.cache-hit != 'true'
        run: |
          uv run python -c "from captain_hook.util.model_cache import ensure_nlp_resources; ensure_nlp_resources()"

      - name: Build documentation
        run: uv run --with "git+https://github.com/yasyf/cc-skills@main#subdirectory=tools/gd-build" gd-build build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      # Warn-only docs quality gates (continue-on-error + per-step timeout = never gate the
      # deploy; publish-docs is a separate job). proofread omitted: needs harper-cli, absent in CI.
      - name: "Docs quality: API lint"
        run: uv run --group docs great-docs lint
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: "Docs quality: link check"
        run: uv run --group docs great-docs check-links
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: "Docs quality: SEO audit"
        run: uv run --group docs great-docs seo
        continue-on-error: true
        timeout-minutes: 2

  publish-docs:
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
