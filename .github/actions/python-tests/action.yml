name: Python tests
description: Run the cache-backed Captain Hook Python test gate.

inputs:
  python-version:
    description: Python version passed to setup-uv.
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache-dependency-glob: uv.lock

    - name: Cache build derivation
      uses: actions/cache@v5
      with:
        path: ~/.cache/capt-hook-build
        key: capt-hook-build-v1-${{ hashFiles('uv.lock') }}
        restore-keys: capt-hook-build-v1-

    - name: Resolve spaCy minor
      id: spacy
      shell: bash
      run: echo "minor=$(grep -A1 '^name = \"spacy\"$' uv.lock | grep '^version' | grep -o '[0-9]*\.[0-9]*' | head -1)" >> "$GITHUB_OUTPUT"

    - name: Cache NLP assets
      id: nlp-cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/spacy/models
          ~/.wn_data
        key: nlp-v5-${{ runner.os }}-spacy-${{ steps.spacy.outputs.minor }}-oewn-31f4af16c54b532fd5484d4cc33aee588a31bb5b70683ae8197842fde5b586bc

    - name: Sync development environment
      shell: bash
      run: uv sync --locked --extra dev

    - name: Test shared evidence through the real Python owner pipe
      if: runner.os == 'macOS'
      shell: bash
      env:
        CAPTAIN_TEST_SNAPSHOT_PYTHON: ${{ github.workspace }}/.venv/bin/python
      run: go test -race ./internal/hookd -run TestSnapshotRealPythonOwnerSharesLoadsAcrossClients -count=1 -v

    - name: Test shared evidence fixtures
      shell: bash
      run: uv run --no-sync pytest tests/test_snapshot_fixture_owner.py -q

    - name: Check generated snapshot schemas
      shell: bash
      run: |
        uv run --no-sync python -m captain_hook.snapshots.schema internal/snapshots/schema --check
        uv run --no-sync python -m captain_hook.snapshots.schema captain_hook/snapshots/schemas --check

    - name: Provision NLP assets
      if: steps.nlp-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: uv run --no-sync python -c "from captain_hook.util.model_cache import ensure_nlp_resources; ensure_nlp_resources()"

    - name: Test
      shell: bash
      run: uv run --no-sync pytest
