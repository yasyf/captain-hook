[project]
name = "capt-hook"
# Inert sentinel — the real version is stamped from the release tag (uv version --frozen).
version = "0.0.0"
description = "Stop repeating yourself to Claude."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Yasyf Mohamedali", email = "yasyfm@gmail.com" }]
keywords = [
    "claude",
    "claude-code",
    "hooks",
    "llm",
    "agents",
    "guardrails",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "cc-transcript[judge]>=10.4,<11",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "ast-grep-py>=0.39,<1",
    "funcy>=2.0",
    "spacy>=3.7",
    "click>=8",
    "rich>=13",
    "orjsonl>=1.0",
    "wn>=1.1.0",
    "lazy-object-proxy>=1.12.0",
    "filelock>=3",
    "loguru>=0.7.3",
    "spawnllm>=0.5.5,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "pyyaml>=6",
    "ruff>=0.8",
]

[project.scripts]
capt-hook = "captain_hook.cli:main"

[project.urls]
Homepage = "https://github.com/yasyf/captain-hook"
Documentation = "https://yasyf.github.io/captain-hook/"
Repository = "https://github.com/yasyf/captain-hook"
Issues = "https://github.com/yasyf/captain-hook/issues"
Changelog = "https://github.com/yasyf/captain-hook/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# cc-transcript v8 (and its tree-sitter deps) ship no Windows wheels, so scope the
# universal lock to the platforms it supports; keeps `uv lock` from resolving an
# uninstallable win32 split and drops pywinpty/win32-setctime from the lock.
[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.build-backend]
module-name = "captain_hook"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--tb=short", "-q"]
markers = ["unit: Pure unit tests", "integration: Integration tests"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["captain_hook"]
venvPath = "."
venv = ".venv"

# ty runs warnings-only via the prek commit hook (astral-sh/ty-pre-commit) and never
# blocks a commit; pyright (strict) stays the primary editor checker.
[tool.ty.rules]
all = "warn"
unused-type-ignore-comment = "ignore"
unresolved-import = "ignore"

[tool.ruff]
line-length = 120
target-version = "py313"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[dependency-groups]
docs = [
    # griffelib is the modern griffe (2.x) distribution; it provides the
    # `griffe` module layout that great-docs imports, overriding the legacy
    # griffe<2 pin great-docs itself declares.
    "griffelib>=2.0",
    "great-docs>=0.14",
]
