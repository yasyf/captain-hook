[project]
name = "capt-hook"
version = "0.1.0"
description = "Declarative hook framework for Claude Code"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Yasyf Mohamedali", email = "yasyfm@gmail.com" }]
keywords = ["claude", "claude-code", "hooks", "llm", "agents", "guardrails", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tree-sitter>=0.24",
    "tree-sitter-bash>=0.23",
    "funcy>=2.0",
    "spacy>=3.7",
    "click>=8",
    "orjsonl>=1.0",
    "wn>=1.1.0",
    "lazy-object-proxy>=1.12.0",
    "filelock>=3",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "pyyaml>=6",
    "ruff>=0.8",
]

[project.scripts]
capt-hook = "captain_hook.cli:main"

[project.urls]
Homepage = "https://github.com/yasyf/captain-hook"
Documentation = "https://yasyf.github.io/captain-hook/"
Repository = "https://github.com/yasyf/captain-hook"
Issues = "https://github.com/yasyf/captain-hook/issues"
Changelog = "https://github.com/yasyf/captain-hook/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "captain_hook"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--tb=short", "-q"]
markers = [
    "unit: Pure unit tests",
    "integration: Integration tests",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["captain_hook"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
docs = [
    # griffelib is the modern griffe (2.x) distribution; it provides the
    # `griffe` module layout that great-docs imports, overriding the legacy
    # griffe<2 pin great-docs itself declares.
    "griffelib>=2.0",
    # Tracking great-docs main until they cut a release newer than 0.13.0: the
    # pinned commit carries build-time GitHub stats (802a5c9d), which drop the
    # widget's client-side API calls (the source of the navbar 403s).
    "great-docs @ git+https://github.com/posit-dev/great-docs@d8540ae2",
]
