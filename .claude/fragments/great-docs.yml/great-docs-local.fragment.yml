# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: captain_hook
display_name: captain-hook
repo: https://github.com/yasyf/captain-hook
site_url: "https://yasyf.github.io/captain-hook/"
pypi: true

navbar_color: "#131a2b"
accent_color:
  light: "#c03a1e"
  dark: "#ff8a70"

social_cards:
  image: docs/assets/social-preview.jpg
  twitter_site: "@yasyf"

hero:
  name: captain-hook
  tagline: "Stop repeating yourself to Claude."

sections:
  - title: Quickstart
    dir: docs/getting-started
    index: false
  - title: Tutorial
    dir: docs/tutorial
    navbar_after: Quickstart
    index: true
    index_columns: 2
  - title: Guides
    dir: docs/guide
    navbar_after: Tutorial
    index: true
    index_columns: 2
  - title: Cheatsheet
    dir: docs/cheatsheet
    navbar_after: Guides
    index: true
  - title: Examples
    dir: docs/examples
    navbar_after: Cheatsheet
    index: true
  - title: Reference
    dir: docs/reference
    navbar_after: Examples
  - title: Development
    dir: docs/development
    navbar_after: Reference

pre_render:
  - docs/scripts/embed_examples.py
  - docs/scripts/embed_skills.py
  - docs/scripts/embed_fragments.py
  - docs/scripts/embed_widgets.py
  - docs/scripts/.gd-build/native_reference_titles.py

cli:
  enabled: true
  module: captain_hook.cli
  name: cli

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

# ToolCall + COMMENT_TYPES raise CyclicAliasError under dynamic griffe;
# dynamic builds always fell back to full-static anyway — pin the fast path.
dynamic: false

# Curated public API (root __init__ re-exports; no __all__). HookResponse,
# InlineTests, TCondition stay excluded: TYPE_ALIAS rendering fails either mode.
reference:
  - title: Registration
    desc: Declaring and registering hooks.
    contents:
      - hook
      - on

