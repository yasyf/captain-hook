# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: captain_hook
display_name: captain-hook
parser: google
dynamic: true
repo: https://github.com/yasyf/captain-hook
site_url: "https://yasyf.github.io/captain-hook/"
pypi: true
github_style: widget
jupyter: python3

navbar_style: lilac
content_style: lilac
accent_color:
  light: "#ffb300"
  dark: "#ffca28"
dark_mode_toggle: true
back_to_top: true
keyboard_nav: true

hero:
  name: captain-hook
  tagline: "Declarative hooks for Claude Code — rules as data, tested inline."
  starfield: true

sections:
  - title: Getting Started
    dir: docs/getting-started
    index: true
    index_columns: 2
  - title: Guide
    dir: docs/guide
    navbar_after: Getting Started
    index: true
    index_columns: 2
  - title: Examples
    dir: docs/examples
    navbar_after: Guide
    index: true
  - title: Reference
    dir: docs/reference
    navbar_after: Examples
  - title: Development
    dir: docs/development
    navbar_after: Reference

pre_render:
  - docs/scripts/embed_examples.py
  - docs/scripts/plain_reference_titles.py

cli:
  enabled: true
  module: captain_hook.cli
  name: cli

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

