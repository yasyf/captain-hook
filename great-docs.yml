# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: captain_hook
display_name: captain-hook
parser: google
repo: https://github.com/yasyf/captain-hook
site_url: "https://yasyf.github.io/captain-hook/"
pypi: true
github_style: widget
jupyter: python3

navbar_color: "#1e293b"
accent_color: "#3b82f6"
dark_mode_toggle: true
back_to_top: true
keyboard_nav: true

hero:
  name: captain-hook
  tagline: "Typed, testable hooks for Claude Code — and a reviewer that learns new ones from the corrections you give Claude."

sections:
  - title: Getting Started
    dir: docs/getting-started
    index: true
    index_columns: 2
  - title: Guide
    dir: docs/guide
    navbar_after: Getting Started
    index: true
    index_columns: 2
  - title: Examples
    dir: docs/examples
    navbar_after: Guide
    index: true
  - title: Reference
    dir: docs/reference
    navbar_after: Examples
  - title: Development
    dir: docs/development
    navbar_after: Reference

pre_render:
  - docs/scripts/embed_examples.py
  - docs/scripts/embed_skills.py
  - docs/scripts/embed_fragments.py
  - docs/scripts/native_reference_titles.py

cli:
  enabled: true
  module: captain_hook.cli
  name: cli

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

# Curated symbol reference (public API only) — the root __init__ re-exports
# define the API; there is no __all__. InlineTests and TCondition are
# excluded automatically (cyclic aliases under dynamic introspection).
