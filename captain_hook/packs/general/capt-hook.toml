[pack]
name = "general"
version = "0.27.0"
description = "Language-agnostic guards: git/jj command safety, doc & prompt nudges, task & plan discipline, model-routing nudges (review, security audit, diagnosis, and bounded decision-light implementation route to gpt-5.6-sol via the codex-wrapper agent; ambiguous/decision-dense/long-run implementation to opus xhigh), a browser-automation delegation nudge for sustained agent-browser/playwright work driven inline on fable, code-review + docs-freshness gates, a detour check-in nudge, blocking verbose-comment enforcement (comment runs over 3 lines / 200 chars denied on the post-edit text, doc-comment carve-out, a comment-density warn), a first-turn nudge to batch-load the always-used deferred tools in one ToolSearch call, and delegated-prose nudges that catch doc writing handed to a subagent or workflow without the writing-docs skill, and blocking rm safety (repo-root deletes are denied everywhere, and on the macOS rewrite path so are the filesystem root, home directories, and any directory that contains a git/jj repository; on macOS, outside-repo literal deletes and globs whose at-most-10 matches are each verified are rewritten to trash when available, while oversized or unverifiable globs remain denied everywhere; risky deletes hidden inside `sh`/`bash -c` payloads and `eval` are checked by descending into the nested command; temp/scratch paths exempt)."
hooks = "."
nlp = true
